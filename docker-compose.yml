services:
  analysis:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DONT_FRET_JOB_ROOT: /data/jobs
      DONT_FRET_CHORD_MODEL_PATH: /models/chordnet.onnx
      DONT_FRET_CHORD_MODEL_CONFIG_PATH: /models/config.json
    volumes:
      - dont-fret-jobs:/data/jobs
      - ./models:/models:ro
    expose:
      - "8000"
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        ANALYSIS_API_ORIGIN: http://analysis:8000
    environment:
      ANALYSIS_API_ORIGIN: http://analysis:8000
    depends_on:
      analysis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
volumes:
  dont-fret-jobs:
