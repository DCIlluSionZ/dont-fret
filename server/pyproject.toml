[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dont-fret-analysis"
version = "0.1.0"
description = "Don't Fret chord analysis service"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn[standard]>=0.32,<1",
  "numpy>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
